plugins {
    id 'java'
    id 'maven-publish'
}

group = 'gg.lode'
version = '1.0.24'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(21)
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.4-R0.1-SNAPSHOT")
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'Recap-API'
            version = project.version
            from components.java
        }
    }

    repositories {
        // Internal artifacts publish to Reposilite on the game node, so other
        // repos resolve them without a developer having run publishToMavenLocal
        // first. Reposilite refuses to overwrite a released version, so a
        // coordinate identifies exactly one build. URL is loopback — publish
        // over the SSH forward.
        maven {
            name = 'phytor'
            url = project.findProperty('phytorMavenUrl') ?: 'http://127.0.0.1:8081/releases'
            allowInsecureProtocol = true
            credentials {
                username = project.findProperty('phytorMavenUser')
                password = project.findProperty('phytorMavenPassword')
            }
        }
    }
}
